[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # connect-src dibuka untuk https: agar RPC jaringan kustom bisa dipakai.
    # Konsekuensi: CSP tidak lagi membatasi tujuan permintaan jaringan. Pertahanan XSS utama
    # tetap script-src 'self'. Untuk mengetatkan kembali, ganti 'https:' dengan daftar host RPC
    # Anda (host bawaan ada di src/lib/chains.ts, plus api.coingecko.com untuk harga).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
